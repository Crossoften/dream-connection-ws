version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
# Nomes únicos por projeto: o container_name genérico do boilerplate
# ("database_application") colide com outros projetos na mesma máquina —
# o último compose up "rouba" o container dos demais.
    container_name: dream_connection_api
    command: tail -f /dev/null
    working_dir: /usr/app
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    depends_on:
      - db
    links:
      - db
    volumes:
      - .:/usr/app

  db:
    image: mysql:8.0
    container_name: dream_connection_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - ${DB_PORT}:3306
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    driver: local
